version: '5.9'
purpose: Repository evidence hints for stack/capability routing. Signals propose candidate specialists; actual code/config/runtime
  evidence remains authoritative.
policy:
  signal_is_evidence_not_truth: true
  multiple_signals_allowed: true
  content_hints_require_confirmation: true
  manifest_changes_trigger_rerouting: true
  existing_stack_preserved_by_default: true
  framework_specialist_requires_material_touch: true
  datastore_specialist_requires_material_touch: true
