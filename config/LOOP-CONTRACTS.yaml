version: '5.9'
policy:
  blind_retry: forbidden
  progress_required_for_same_strategy: true
  fast_feedback_is_not_acceptance: true
  state_file: planning/execution/LOOP-STATE.json
  behavioral_oracle_from_authority: true
  assurance_failure_invalidates_only_affected_evidence: true
  verification_blocker_is_not_execution_blocker: true
  completion_transition_fail_closed: true
  state_mutation_via_controller: true
  pre_dispatch_reconciliation: true
  job_attempt_separate_from_job: true
  objective_progress_signature: true
  tri_state_review: true
loops:
  DISCOVERY_LOOP:
    trigger:
    - intake_started
    - material_unknown_found
    continue_when:
    - material_unknown_remaining
    - useful_opportunity_unresolved
    success_when:
    - discovery_ready
    escalate_when:
    - true_product_decision_required
  RESEARCH_LOOP:
    trigger:
    - drift_prone_decision
    - evidence_gap
    continue_when:
    - new_research_likely_to_change_decision
    success_when:
    - decision_evidence_sufficient
    escalate_when:
    - authority_conflict
    - unavailable_required_source
  PROGRAM_DESIGN_STEERING_LOOP:
    trigger:
    - cross_file_change
    - cross_layer_change
    - first_vertical_slice
    continue_when:
    - design_runtime_mismatch
    success_when:
    - design_and_runtime_converged
    escalate_when:
    - architecture_invalidated
  EXECUTION_LOOP:
    trigger:
    - dependency_ready_job
    continue_when:
    - ready_work_exists
    - verification_blocker_exists_but_independent_work_remains
    success_when:
    - all_required_jobs_validated
    escalate_when:
    - execution_blocker_with_no_dependency_ready_work
    - policy_denied
  REPAIR_LOOP:
    trigger:
    - verification_failed
    continue_when:
    - recoverable
    - new_evidence_or_strategy
    success_when:
    - targeted_verification_passed
    no_progress_action: change_strategy_or_repair_diagnosis
    escalation:
    - fresh_debugger
    - job_resize
    - reroute_capability
    - architecture_review
    terminal:
    - RESOLVED
    - BLOCKED_EXTERNAL
    - RETRY_EXHAUSTED
    pre_repair_gates:
    - behavioral_oracle
    - root_cause_depth_gate
  WORKER_LIVENESS_LOOP:
    trigger:
    - worker_quiet
    - worker_health_signal
    continue_when:
    - worker_running_or_recoverable
    success_when:
    - worker_done_with_evidence
    no_progress_action: health_check_then_reconcile
    escalation:
    - checkpoint_resume
    - resize_job
    - reroute_worker
  CONVERGENCE_LOOP:
    trigger:
    - job_integrated
    - evidence_stale
    - requirement_changed
    continue_when:
    - uncovered_requirement
    - stale_evidence
    - docs_out_of_sync
    success_when:
    - requirements_code_runtime_ux_evidence_docs_converged
    escalation:
    - scoped_replan
  CONTEXT_RESUME_LOOP:
    trigger:
    - context_boundary
    - restart
    - compaction
    continue_when:
    - state_reconstruction_incomplete
    success_when:
    - minimal_authoritative_context_reconstructed
    escalation:
    - state_reconciliation
  PARALLELISM_LOOP:
    trigger:
    - multiple_ready_jobs
    continue_when:
    - parallelism_improves_validated_throughput
    success_when:
    - wave_integrated
    escalation:
    - reduce_wip
    - serialize_shared_surface
  FAILURE_MODE_CLOSURE_LOOP:
    trigger:
    - confirmed_defect
    continue_when:
    - durable_protection_missing
    success_when:
    - root_cause_fixed_and_smallest_durable_guard_verified
    escalation:
    - independent_review
  SKILL_ESCALATION_LOOP:
    trigger:
    - worker_reports_missing_skill_or_reference
    continue_when:
    - request_classification_pending
    success_when:
    - L0_reference_loaded
    - L1_skill_granted
    - L2_job_rebriefed
    - L3_change_control_entered
    escalate_when:
    - semantic_job_change
    - project_authority_boundary_change
  DEFERRED_VALIDATION_LOOP:
    trigger:
    - implementation_feasible_work_exhausted
    - verification_blocker_recorded
    continue_when:
    - automatable_validation_ready
    - batched_human_or_external_validation_can_be_requested
    success_when:
    - all_mandatory_deferred_validation_resolved
    escalate_when:
    - validation_failure_creates_repair_job
    - execution_assumption_invalidated
  PLANNING_CONVERGENCE_LOOP:
    trigger:
    - planning_artifact_changed
    - planning_review_finding
    continue_when:
    - issue_signature_improves
    success_when:
    - decision_coverage_complete
    - planning_artifact_dag_ready
    no_progress_action: change_planning_strategy
    escalate_when:
    - same_issue_signature_plateaus
  STATE_RECONCILIATION_LOOP:
    trigger:
    - pre_dispatch
    - restart
    - context_boundary
    - control_drift
    continue_when:
    - safe_repairs_remaining
    success_when:
    - authority_and_projections_consistent
    escalate_when:
    - ambiguous_authority_conflict
    - protected_surface_drift
  ATTEMPT_LIFECYCLE_LOOP:
    trigger:
    - job_claimed
    continue_when:
    - lease_valid
    - worker_heartbeat_fresh
    success_when:
    - structured_worker_result_settled
    escalate_when:
    - lease_expired
    - attempt_orphaned
    - worker_result_invalid
  REVIEW_VERDICT_LOOP:
    trigger:
    - verification_required
    continue_when:
    - unverifiable_followup_available
    success_when:
    - PASS
    terminal_fail:
    - FAIL
    unverifiable: must_create_followup_evidence_not_pass
  FEASIBILITY_RESEARCH_LOOP:
    trigger:
    - critical_capability_unknown
    - architecture_feasibility_claim
    continue_when:
    - decision_changing_evidence_gap
    success_when:
    - critical_claim_proven_or_explicitly_external
    escalate_when:
    - critical_claim_disproven
    - decisive_spike_required
  PLAN_CHECKER_LOOP:
    trigger:
    - planning_compiled
    continue_when:
    - blocking_plan_finding_exists
    success_when:
    - independent_plan_checker_pass
    - cold_start_implementability_pass
    no_progress_action: change_planning_strategy
  PARENT_REVERIFY_LOOP:
    trigger:
    - worker_returns_completion_claim
    continue_when:
    - applicable_gate_unreverified
    - manual_evidence_unreviewed
    success_when:
    - fresh_parent_reverification_pass
    escalate_when:
    - scope_violation
    - verification_failure
    - stale_candidate
  INTEGRATION_GATE_LOOP:
    trigger:
    - integration_node_children_complete
    continue_when:
    - seam_or_contract_unverified
    success_when:
    - children_reverified
    - interface_e2e_regression_pass
  RESEARCH_DRIFT_LOOP:
    trigger:
    - execution_research_changes_assumption
    continue_when:
    - impact_classification_pending
    success_when:
    - local_detail_updated
    - job_rebriefed
    - scoped_replan_completed
    escalate_when:
    - critical_feasibility_refuted
    - authority_boundary_changed
  QUALITY_SATURATION_LOOP:
    trigger:
    - substantive_implementation_complete
    continue_when:
    - material_defect_found
    success_when:
    - expert_reread_and_defect_hunt_dry
    no_progress_action: fresh_debugger_or_strategy_change
patch_release: 5.9.1
