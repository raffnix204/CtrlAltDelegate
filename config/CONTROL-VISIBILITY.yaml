version: '5.8.2'
default: LOCAL_PRIVATE
modes:
  LOCAL_PRIVATE:
    inbound_archive_ignored: true
    control_root_ignored: true
    parent_git_history_required: false
    post_import_archive: MOVE_TO_CONTROL_INBOX
  TRACKED_SHARED:
    opt_in_only: true
    require_allowlist: true
    always_ignore:
    - private
    - raw
    - tmp
    - logs
    - cache
    - import-conflicts
