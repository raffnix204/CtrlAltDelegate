version: '5.8'
goal: Maximize job-specific expertise and correctness while minimizing active context and solution surface. Library
  size is unconstrained; active job skill set is the smallest complete evidence-backed set.
selection_pipeline:
- PROJECT_PROFILE
- STACK_READY
- CAPABILITY_MAP_READY
- RISK_AND_CHANGE_TRIGGERS
- PROJECT_SKILLSET_READY
- JOB_SKILLSET_READY
- DELEGATE_WITH_EXACT_PATHS
- WORKER_SKILLS_APPLIED
rules:
  no_fixed_skill_count_limit: true
  never_preload_full_library: true
  selected_project_skill_is_not_automatically_loaded_by_every_job: true
  exact_paths_required: true
  references_progressive_only: true
  reroute_on_new_evidence: true
