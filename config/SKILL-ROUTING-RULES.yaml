language_framework_rule: Add each language/runtime/framework specialist only when the job materially edits/reviews
  that stack. Framework specialist complements, not replaces, language specialist.
review_rule: Use diff-sensitive reviewers. Security/data/network/release specialists review only when their risk
  trigger is present. Avoid fixed reviewer counts.
research_rule:
  reuse_exported_evidence_first: true
  modes:
  - NONE
  - VERIFY_DRIFT
  - TARGETED
  - SPIKE
  add_technical_research_skill_when: a material technical decision depends on current external facts or an unresolved
    compatibility/behavior claim
  autonomous_decision_after_research: true
  user_decision_only_for:
  - product/scope behavior change
  - possible data loss
  - weaker security/privacy
  - material recurring cost/vendor business commitment
  - compliance exception
  - external credential/approval unavailable
documentation_impact:
  any_non_none:
  - documentation-engineering
  final_user_facing:
  - documentation-engineering
  - verification-gate
context_parallelism:
  long_running_or_multi_job:
  - context-efficiency
  parallel_wave:
  - context-efficiency
solution_minimization:
  before_substantive_implementation: true
  fresh_complexity_review_when_material: true
  finding_classes:
  - DELETE
  - REUSE
  - STDLIB
  - NATIVE
  - DEPENDENCY
  - YAGNI
  - SHRINK
convergence:
  required_before_completion: true
  artifacts:
  - planning/execution/CONVERGENCE-MATRIX.json
  - planning/execution/EVIDENCE-INDEX.json
  evidence_sha_bound: true
microtask_batching:
  enabled: true
  batch_when: small same-shape jobs share skills/verification and do not benefit from isolated reasoning
  do_not_batch_when: different risk/seams/owners or a failure needs independent isolation
