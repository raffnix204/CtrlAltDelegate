version: '5.9'
policy:
  instructions_are_not_enforcement: true
  fail_closed_when_required_enforcement_missing: true
  enforcement_levels:
  - ENFORCED
  - OBSERVED
  - ADVISORY
classes:
  LOCKED:
    enforcement: ENFORCED
    paths:
    - config/PRODUCT-COMPLETION-POLICY.yaml
    - config/EXECUTION-CONTROL-POLICY.yaml
    - config/STATE-RECONCILIATION.yaml
    - config/SURFACE-POLICY.yaml
    - planning/acceptance/USER-JOURNEY-ORACLES.yaml
    mutation: change_control_or_controller_only
  CONTROLLER_MUTATED:
    enforcement: ENFORCED
    paths:
    - planning/execution/JOB-GRAPH.json
    - planning/execution/BLOCKERS.json
    - planning/execution/DEFERRED-VALIDATION.json
    - planning/execution/WORKER-CLAIMS.json
    - planning/execution/ATTEMPT-STATE.json
    - planning/execution/LOOP-STATE.json
    - planning/execution/REVIEW-VERDICTS.json
    mutation: approved_controller_and_receipt
  DERIVED:
    enforcement: ENFORCED
    paths:
    - planning/execution/EXECUTION-SNAPSHOT.json
    mutation: generator_only
  APPEND_ONLY:
    enforcement: ENFORCED
    paths:
    - planning/execution/DECISION-LEDGER.jsonl
    - planning/execution/CONTROL-EVENTS.jsonl
    - planning/execution/CONTROL-MUTATION-LOG.jsonl
    - planning/execution/JOB-ATTEMPTS.jsonl
    - planning/execution/RECOVERY-ACTIONS.jsonl
    - planning/execution/RECONCILIATION-LOG.jsonl
    - planning/execution/CONTROL-INSIGHTS.jsonl
    - planning/execution/RULINGS.jsonl
    mutation: append_only
  EDITABLE:
    enforcement: OBSERVED
    paths:
    - job_allowed_source_scope
    - job_allowed_tests
  HUMAN_CONTROLLED:
    enforcement: ADVISORY
    paths:
    - production_deploy
    - destructive_data_action
    - credentials
    - compliance_exception
validator: scripts/validate_control_mutation.py
install: scripts/install_git_guards.py
