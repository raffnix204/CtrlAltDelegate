version: 5.8.2
purpose: Routing, behavior and system-regression scenarios for V5.8.2 skill-driven planning, closed-loop execution
  and deterministic handoff.
baseline_policy:
  existing_skill_change: compare against frozen V5.5 skill entrypoint
  new_skill: compare against global execution contract plus adjacent generic skills without the new specialist
  repeated_runs: use when stochastic variance can affect the verdict
  record:
  - pass_rate
  - decision_quality
  - active_context_tokens
  - reference_tokens_loaded
  - elapsed_time
  - variance
scenarios:
- id: route-sqlite-vector-local
  class: routing
  prompt: Add local semantic search to the existing SQLite desktop app.
  required:
  - solution-minimization-engineering
  - sqlite-engineering
  - sqlite-vector-search-engineering
  forbidden:
  - postgres-engineering
  - mongodb-engineering
  - flutter-engineering
- id: route-react-ui
  class: routing
  prompt: Implement a new accessible React form flow in the existing web app.
  required:
  - solution-minimization-engineering
  - react-web-engineering
  - component-engineering
  - accessibility-audit
  forbidden:
  - react-native-engineering
  - flutter-engineering
  - angular-engineering
- id: route-cloudflare-worker
  class: routing
  prompt: Add a Cloudflare Worker endpoint that stores uploaded objects in R2 and records metadata in D1.
  required:
  - cloudflare-platform-engineering
  - serverless-edge-engineering
  forbidden:
  - wordpress-engineering
  - mongodb-engineering
- id: route-terraform-not-generic-only
  class: routing
  prompt: Refactor existing Terraform resources into a reusable module without recreating production infrastructure.
  required:
  - terraform-engineering
  - infrastructure-as-code-engineering
  forbidden:
  - cloudflare-platform-engineering
- id: route-threat-model
  class: routing
  prompt: Threat-model a new multi-tenant admin impersonation feature before implementation.
  required:
  - threat-modeling-engineering
  - auth-architecture
  - security-review
  forbidden:
  - property-based-testing
- id: route-property-negative
  class: routing
  prompt: Add three normal example unit tests for this pure tax calculation function.
  required:
  - test-engineering
  forbidden:
  - property-based-testing
- id: behavior-nextjs-cache-auth
  class: behavior
  prompt: In a Next.js App Router dashboard, cache product catalog reads but keep per-user notification counts private.
    A Server Action edits a product and must refresh affected catalog views.
  required:
  - nextjs-engineering
  - react-web-engineering
  forbidden:
  - mongodb-engineering
  assertions:
  - distinguishes cacheable catalog identity from request-specific user notification state
  - keeps cookies/session/request data outside shared cached values unless intentionally keyed
  - authenticates/authorizes/validates the Server Action on the server
  - maps mutation invalidation to the same cache domain as catalog reads
  - requires current project-version caching semantics and production-build verification
- id: behavior-react-stale-effect
  class: behavior
  prompt: A React search page fetches on every query change. Fast typing sometimes shows results for an older query
    after a newer request completed. Fix it without adding a global store.
  required:
  - react-web-engineering
  - systematic-debugging
  forbidden:
  - nextjs-engineering
  assertions:
  - identifies async response ordering/cancellation ownership rather than state-library absence
  - uses abort or stale-result suppression tied to current intent
  - keeps state local or URL-owned unless another owner is proven
  - adds a regression test that forces reordered completion
- id: behavior-angular-ssr-state
  class: behavior
  prompt: An Angular SSR app stores the current tenant in a root-provided mutable service. Under load, rare requests
    render another tenant's navigation. Diagnose and redesign.
  required:
  - angular-engineering
  - security-review
  forbidden:
  - react-web-engineering
  assertions:
  - recognizes root/provider process lifetime as a cross-request state leak risk
  - moves tenant state to request-safe ownership or explicit context
  - verifies concurrent SSR requests for isolation and hydration
  - does not treat route guards as server authorization
- id: behavior-react-native-upgrade
  class: behavior
  prompt: Upgrade a brownfield React Native app with custom native modules and push notifications across two RN
    versions. It uses CocoaPods and Gradle and currently runs Hermes.
  required:
  - react-native-engineering
  - dependency-upgrade-engineering
  forbidden:
  - flutter-engineering
  assertions:
  - treats upgrade as JS plus iOS plus Android native/template migration
  - checks native module/New Architecture/Hermes compatibility before completion
  - reconciles Podfile/Gradle/native config rather than package.json only
  - verifies release-like builds on both platforms and notification/deep-link behavior
- id: behavior-flutter-cpu-jank
  class: behavior
  prompt: A Flutter app freezes for 600ms when parsing a large locally cached JSON document even though the parsing
    function is async. Fix the jank with minimal architecture change.
  required:
  - flutter-engineering
  - performance-profiling
  forbidden:
  - react-native-engineering
  assertions:
  - distinguishes async I/O from CPU work on the UI isolate
  - profiles/confirms the parsing hotspot before broad changes
  - considers an isolate for CPU work instead of adding a state-management framework
  - verifies profile/release-like frame behavior and cancellation/lifecycle ownership
- id: behavior-postgres-rls-plan
  class: behavior
  prompt: A Postgres multi-tenant table uses RLS and a policy on tenant_id. Queries became slow at 50M rows, and
    an admin connection can see all tenants. Review correctness and performance.
  required:
  - postgres-engineering
  - security-review
  - performance-profiling
  forbidden:
  - mongodb-engineering
  assertions:
  - tests RLS under actual application and privileged roles including bypass behavior
  - examines policy predicate/index support with EXPLAIN evidence
  - separates intentional admin bypass from tenant application role
  - avoids disabling RLS as a performance fix
- id: behavior-graphql-loader-auth
  class: behavior
  prompt: A GraphQL API has an N+1 problem on nested orders.customer, and its DataLoader was moved to a global singleton
    for speed. The service is multi-tenant.
  required:
  - graphql-engineering
  - security-review
  forbidden:
  - api-contracts
  assertions:
  - makes batching/cache request-scoped and tenant/authorization-safe
  - verifies data-source call counts for representative nested queries
  - preserves resource authorization for alternate query shapes
  - does not solve N+1 by global cross-request cache
- id: behavior-terraform-refactor
  class: behavior
  prompt: Move 40 existing Terraform resources under module.network while keeping every cloud resource in place.
    Production state is remote and locked.
  required:
  - terraform-engineering
  - infrastructure-as-code-engineering
  forbidden:
  - database-migrations
  assertions:
  - enumerates old and new Terraform addresses/resource identities
  - uses supported moved/state mechanisms rather than recreate
  - requires plan evidence showing no unintended destroy/create/replace
  - preserves remote state locking and candidate/apply coherence
- id: behavior-mongodb-model
  class: behavior
  prompt: Design MongoDB storage for IoT devices that emit one sample per second for years. The current prototype
    embeds every sample in the device document.
  required:
  - mongodb-engineering
  - database-design
  forbidden:
  - postgres-engineering
  assertions:
  - rejects unbounded embedded growth
  - evaluates bucket/time-series or bounded child-document design from query/update patterns
  - plans indexes from representative device/time-range queries
  - considers retention/archival and document-size/update-contention behavior
- id: behavior-cloudflare-global-state
  class: behavior
  prompt: A Cloudflare Worker keeps active checkout sessions in a module-level Map and occasionally loses them after
    quiet periods. Replace it with the smallest correct platform design.
  required:
  - cloudflare-platform-engineering
  - reliability-observability
  forbidden:
  - redis-caching-engineering
  assertions:
  - identifies isolate/module globals as non-durable correctness state
  - chooses a Cloudflare state primitive from coordination/consistency requirements
  - keeps module globals only for safe non-authoritative cache hints if useful
  - tests restart/concurrency semantics of the selected state owner
- id: behavior-wordpress-rest-security
  class: behavior
  prompt: A WordPress plugin exposes a REST endpoint that deletes a custom record. It verifies a nonce but has no
    capability check. Fix and add tests.
  required:
  - wordpress-engineering
  - security-review
  forbidden:
  - laravel-engineering
  assertions:
  - treats nonce as CSRF/intent aid rather than authorization
  - adds resource/operation capability authorization in the REST permission boundary
  - validates input and preserves context-appropriate output handling
  - tests unauthorized/expired or invalid-intent paths directly through REST
- id: behavior-threat-model-recovery
  class: behavior
  prompt: Threat-model an account recovery flow that lets organization owners regain access after losing MFA. The
    product is multi-tenant and owners can invite admins.
  required:
  - threat-modeling-engineering
  - auth-architecture
  - security-review
  forbidden:
  - property-based-testing
  assertions:
  - maps assets actors trust boundaries and recovery/admin entry points before listing threats
  - includes takeover enumeration replay social/tenant-admin abuse paths where plausible
  - maps threats to prevent detect recover controls and security invariants
  - turns accepted controls into concrete requirements/tests/audit evidence
- id: behavior-property-roundtrip
  class: behavior
  prompt: We have a URL config parser and serializer. Example tests keep missing Unicode, escaping and ordering
    bugs. Add a stronger test strategy without duplicating parser implementation.
  required:
  - property-based-testing
  - test-engineering
  forbidden:
  - browser-acceptance
  assertions:
  - identifies round-trip/canonicalization properties independent of implementation
  - designs structured generators including Unicode/boundaries/malformed cases
  - uses shrinking/reproducible seeds and persists real counterexamples
  - retains targeted examples for important business cases
- id: behavior-django-job-after-commit
  class: behavior
  prompt: A Django view creates an invoice in a transaction and immediately enqueues a Celery job. Rarely the worker
    cannot find the invoice.
  required:
  - django-engineering
  - background-job-engineering
  forbidden:
  - rails-engineering
  assertions:
  - identifies queue dispatch before transaction commit
  - moves handoff to after-commit semantics or equivalent durable pattern
  - makes job retry/duplicate safe where required
  - adds a regression test for transaction/worker timing
- id: behavior-fastapi-blocking
  class: behavior
  prompt: A FastAPI async endpoint calls a synchronous SDK that can block for five seconds and throughput collapses
    under 100 concurrent requests.
  required:
  - fastapi-engineering
  - performance-profiling
  forbidden:
  - django-engineering
  assertions:
  - identifies event-loop blocking rather than assuming async keyword is sufficient
  - uses framework/runtime-supported isolation or a coherent sync design
  - verifies with representative concurrent requests
- id: behavior-spring-transaction-proxy
  class: behavior
  prompt: A Spring Boot service calls its own @Transactional method internally and partial database writes remain
    after an exception.
  required:
  - spring-boot-engineering
  - database-design
  forbidden:
  - quarkus-engineering
  assertions:
  - identifies proxy/self-invocation transaction boundary problem
  - moves transaction ownership to a clear externally intercepted use-case boundary or equivalent supported design
  - tests rollback across all writes
- id: behavior-svelte-ssr-global
  class: behavior
  prompt: A SvelteKit app stores the authenticated user in a module-level variable used by server load functions.
    Users occasionally see another user's name.
  required:
  - sveltekit-engineering
  - security-review
  forbidden:
  - vue-nuxt-engineering
  assertions:
  - identifies cross-request module-global mutable state leak
  - moves identity to request/session-safe server context
  - tests concurrent SSR requests and hydration
- id: behavior-vue-reactivity
  class: behavior
  prompt: A Vue composable returns a reactive object, but a component destructures fields and they stop updating.
    Fix with minimal changes.
  required:
  - vue-nuxt-engineering
  forbidden:
  - react-web-engineering
  assertions:
  - identifies reactivity identity/destructuring issue
  - preserves reactive references using project-version-supported Vue pattern
  - avoids adding a global state library
- id: system-global-contract-survives
  class: system_regression
  prompt: Implement a small low-risk Next.js validation fix. The Next.js skill no longer contains generic escalation/evidence/routing
    boilerplate.
  required:
  - nextjs-engineering
  - solution-minimization-engineering
  - implementation-engineering
  forbidden: []
  assertions:
  - still follows the global user-escalation boundary without asking about routine technical choices
  - still requires falsifiable regression evidence and does not weaken tests
  - still uses smallest complete solution and MICRO/SMALL rightsizing
  - still returns SKILLS_APPLIED and routes only job-relevant references
- id: system-progressive-reference-loading
  class: system_regression
  prompt: Review a React component that has a local effect race but no server rendering and no performance complaint.
  required:
  - react-web-engineering
  forbidden:
  - nextjs-engineering
  assertions:
  - loads state-effects-and-concurrency reference when useful
  - does not preload server-client-and-hydration or performance reference without need
  - preserves active-context minimization
- id: system-new-evidence-reroute
  class: system_regression
  prompt: During implementation of a generic serverless API, repository inspection reveals it actually deploys to
    Cloudflare Workers and uses Durable Objects.
  required:
  - cloudflare-platform-engineering
  - serverless-edge-engineering
  forbidden: []
  assertions:
  - updates stack/skill routing for future affected jobs instead of continuing with generic assumptions
  - invalidates only affected decisions/evidence rather than restarting unrelated planning
  - verifies worker capability/runtime requirements before dispatch
- id: system-high-risk-not-rightsized-away
  class: system_regression
  prompt: Change a single Terraform firewall rule that could lock operators out of the only management path.
  required:
  - terraform-engineering
  - infrastructure-as-code-engineering
  - network-infrastructure-engineering
  forbidden: []
  assertions:
  - classifies the risky job at a stricter risk level despite small diff size
  - requires rollback/out-of-band recovery and plan evidence
  - does not relax security/recovery gates under MICRO/SMALL ceremony rules
- id: system-contract-export-parity
  class: system_regression
  prompt: Generate a coding-agent delivery containing specialist skills from the Custom-GPT planning pack. The exported
    global skill contract must not be improvised or reconstructed from memory.
  required:
  - implementation-engineering
  forbidden: []
  assertions:
  - materializes docs/system/SKILL-EXECUTION-CONTRACT.md from the embedded canonical template
  - exported contract bytes/hash match the embedded canonical contract
  - does not duplicate the global contract into every specialist SKILL.md
  - selected progressive references remain job-relevant rather than globally preloaded
- id: system-no-empty-expert-decisions
  class: system_regression
  prompt: Package a project that selects UniFi, CI/CD and analytics-database specialists. Validate the selected
    skill artifacts before delivery.
  required:
  - unifi-network-engineering
  - ci-cd-engineering
  - analytics-database-engineering
  forbidden: []
  assertions:
  - no numbered Expert Decision heading is empty or heading-only
  - cataloged progressive references exist and add decision/failure/verification guidance
  - legacy repeated execution-contract boilerplate is absent
  - global contract remains a separate shared surface
- id: behavior-unifi-safe-network-change
  class: behavior
  prompt: Automate a UniFi management-VLAN and switch-port change across several sites without risking loss of controller/device
    access. The exact Network application versions differ by site.
  required:
  - unifi-network-engineering
  - network-infrastructure-engineering
  - network-automation-engineering
  forbidden:
  - openwrt-engineering
  assertions:
  - discovers console/Network versions and current API/capabilities before mutable calls
  - maps operator/controller/device management paths and preserves out-of-band or timed rollback
  - canaries risky change and treats controller/API acceptance as not yet device convergence
  - verifies bidirectional client traffic plus VLAN/route/DHCP/DNS/firewall/device health evidence before widening
- id: behavior-opnsense-safe-api-change
  class: behavior
  prompt: Use the OPNsense API to add and roll out a firewall/NAT change on a remote site. API docs are incomplete
    for one field and losing the management path would require an onsite visit.
  required:
  - opnsense-engineering
  - network-infrastructure-engineering
  - network-automation-engineering
  forbidden:
  - unifi-network-engineering
  assertions:
  - discovers exact OPNsense module/controller/model and effective API privileges
  - uses current first-party model/GUI request behavior to resolve undocumented parameters instead of guessing
  - preserves management/recovery path and stages rollback before apply/reconfigure
  - verifies generated/live rule/NAT state, counters/logs and representative forward/return traffic after apply
- id: behavior-openwrt-safe-remote-change
  class: behavior
  prompt: Remotely change OpenWrt VLAN/firewall/DHCP configuration on a router with no onsite operator. Several
    installed packages and the release version are unknown.
  required:
  - openwrt-engineering
  - network-infrastructure-engineering
  - network-automation-engineering
  forbidden:
  - opnsense-engineering
  assertions:
  - inventories release/target/packages/free space and current UCI/runtime state before changing config
  - uses supported UCI/ubus/rpcd interfaces rather than brittle generated-file edits where the package supports
    them
  - preserves SSH/LuCI recovery or automatic rollback for management-path changes
  - verifies live interface/route/firewall/DHCP/DNS behavior and representative LAN/WAN client traffic after commit/reload
- id: system-standalone-new-project-entry
  prompt: A user opens a fresh complete GitHub-native CtrlAltDelegate checkout. STATE is NOT_STARTED and discovery
    is NOT_READY. They describe a new product idea and have not used the Custom GPT.
  required:
  - technical-research
  forbidden: []
  assertions:
  - selects FULL_LIFECYCLE rather than EXECUTION_HANDOFF
  - starts collaborative discovery before consequential stack/architecture or implementation
  - does not require planning/handoff/FINAL-START-PROMPT.md or a Custom GPT baseline
  - persists discovery decisions and resumes forward through the normal lifecycle
  class: system_regression
- id: system-resume-partial-planning-entry
  prompt: A repository has DISCOVERY_READY and resolved REQUIRED/PREFERRED/AUTO constraints, but research/stack/program
    design and execution DAG are not ready. A new coding-agent session starts.
  required:
  - technical-research
  forbidden: []
  assertions:
  - selects RESUME_PLANNING
  - preserves resolved discovery and does not ask the same questions again
  - resumes the earliest unresolved material planning gate
  - does not begin broad implementation before the required planning baseline is ready
  class: system_regression
- id: system-execution-handoff-entry
  prompt: A complete Custom-GPT planning delivery has requirements, research, stack, program design, selected skills
    and an execution-ready DAG, but no implementation has started.
  required:
  - implementation-engineering
  forbidden: []
  assertions:
  - selects EXECUTION_HANDOFF
  - treats the handoff as authoritative unless current repository/runtime evidence contradicts it
  - does not restart broad discovery
  - validates/reconverges only contradicted artifacts then enters right-sized execution
  class: system_regression
- id: system-resume-interrupted-execution-entry
  prompt: STATE records an active job, candidate SHA, completed wave and exact next action after an agent restart.
    The planning baseline was already execution-ready.
  required:
  - implementation-engineering
  forbidden: []
  assertions:
  - selects RESUME_EXECUTION
  - reconciles actual Git/runtime/evidence with persisted state
  - resumes the exact dependency-ready action instead of restarting discovery or planning
  - preserves completed validated work and refreshes only stale evidence
  class: system_regression
- id: system-language-german-user-english-artifacts
  class: system_regression
  prompt: The user writes a new-project request in German and continues the planning conversation in German.
  required: []
  forbidden: []
  assertions:
  - conversational replies remain German unless the user requests another language
  - persisted CtrlAltDelegate planning and system artifacts are English
  - localized product content is preserved only when it is an explicit project requirement
- id: system-language-spanish-user-english-artifacts
  class: system_regression
  prompt: The user writes a new-project request in Spanish and continues the planning conversation in Spanish.
  required: []
  forbidden: []
  assertions:
  - conversational replies remain Spanish unless explicitly overridden
  - repository planning handoff and system documents remain English
  - technical identifiers commands and paths are not translated when precision would be reduced
- id: system-custom-delivery-fixed-control-root
  class: system_regression
  prompt: A completed Custom-GPT planning run is exported for a project named Northwind Portal. Verify delivery
    topology.
  assertions:
  - archive name is ctrlaltdelegate-delivery.zip regardless of project name
  - single top-level directory is ctrlaltdelegate
  - project identity remains metadata rather than filesystem topology
  - coding agent is instructed to start from the target project root
- id: system-custom-delivery-handoff-required
  class: system_regression
  prompt: The planner produced all planning documents but omitted the coding-agent start prompt. Decide whether
    delivery is complete.
  assertions:
  - does not claim DELIVERY_READY
  - requires CODING-AGENT-START-PROMPT.md
  - requires HANDOFF-STATUS.yaml to be written only after closure checks
  - treats planning files and handoff generation as one atomic logical operation
- id: system-hidden-control-root-path-resolution
  class: system_regression
  prompt: The user copied ctrlaltdelegate-delivery.zip into an existing repository, the coding agent safely imported
    it to .ctrlaltdelegate/, and execution now starts from repository root.
  assertions:
  - sets PROJECT_ROOT to the target repository root
  - sets CONTROL_ROOT to ./.ctrlaltdelegate
  - reads handoff and state through ./.ctrlaltdelegate paths
  - implements product code in PROJECT_ROOT rather than CONTROL_ROOT
- id: system-handoff-fail-closed
  class: system_regression
  prompt: The start prompt points to ctrlaltdelegate but HANDOFF-STATUS.yaml is missing.
  assertions:
  - reports BLOCKED_DELIVERY_INCOMPLETE
  - names the missing path
  - does not guess a differently named planning directory
  - does not restart broad planning as a substitute for a broken package
- id: system-loop-no-progress-circuit-breaker
  class: system_regression
  prompt: A repair loop hits the same failure twice with the same relevant state and no new evidence or meaningful
    diff.
  required:
  - systematic-debugging
  forbidden: []
  assertions:
  - classifies NO_PROGRESS
  - does not blind-retry the same strategy
  - changes strategy or escalates according to REPAIR_LOOP
  - persists loop/progress state
- id: system-job-graph-ready-claim
  class: system_regression
  prompt: Two jobs are ready but both touch a declared single-writer schema surface.
  required:
  - implementation-engineering
  forbidden: []
  assertions:
  - uses JOB-GRAPH as machine-readable state
  - does not concurrently claim the same protected surface
  - serializes or re-scopes conflicting jobs
  - persists claim state before dispatch
- id: system-surface-policy-enforcement
  class: system_regression
  prompt: An implementer proposes weakening an acceptance evaluator to make a failing change pass.
  required:
  - verification-gate
  forbidden: []
  assertions:
  - treats evaluator as LOCKED for the job
  - does not confuse AGENTS guidance with enforcement
  - uses native harness protection when available
  - routes a legitimate requirement change through the owning planning workflow
- id: system-artifact-consistency-gate
  class: system_regression
  prompt: Requirements require reversible deletion, but the architecture and job graph define irreversible deletion
    with no recovery verification.
  required:
  - technical-research
  forbidden: []
  assertions:
  - detects cross-artifact contradiction before consequential implementation
  - routes finding to architecture/job owner artifacts
  - does not silently rewrite requirements
  - updates only affected artifacts and reconverges
- id: system-deepseek-harness-first-class-preview
  class: system_regression
  prompt: Run CtrlAltDelegate with DeepSeek Harness in a repository containing AGENTS.md and canonical .agents/skills.
  required: []
  forbidden: []
  assertions:
  - classifies DeepSeek Harness FIRST_CLASS_PREVIEW
  - uses .agents/skills without generating duplicate .dsh/skills
  - detects actual subagent/sandbox/approval capabilities
  - fails loud or reroutes unsupported required capabilities
- id: system-context-tool-rightsizing
  class: system_regression
  prompt: A MICRO change needs one file edit and one targeted test, while the harness exposes many unrelated tools
    and skills.
  required:
  - implementation-engineering
  forbidden: []
  assertions:
  - uses smallest sufficient tool/context surface
  - does not preload unrelated skills
  - keeps requirement-driven final quality
  - expands capabilities only if evidence requires it
- id: system-custom-zip-direct-import
  class: system_regression
  prompt: The user copies ctrlaltdelegate-delivery.zip into an existing public project repository and starts the
    coding agent from repository root without extracting it.
  required:
  - implementation-engineering
  forbidden: []
  assertions:
  - keeps PROJECT_ROOT as target repository root
  - safely extracts only .ctrlaltdelegate to a temporary path then promotes after validation
  - adds missing ignore rules without replacing existing .gitignore
  - does not commit the inbound ZIP or local control root by default
- id: system-custom-zip-import-fail-closed
  class: system_regression
  prompt: The inbound CtrlAltDelegate ZIP contains a ../ path and a second top-level directory.
  required: []
  forbidden: []
  assertions:
  - rejects archive before promotion
  - reports BLOCKED_DELIVERY_INCOMPLETE
  - does not extract traversal paths
  - does not guess or partially execute from the malformed package
- id: planning-skill-routing-web
  class: system_regression
  prompt: Plan a new public B2B website and offer complete page copy before implementation.
  required:
  - ux-product-design
  - ui-design-system
  - seo-strategy
  - technical-seo-engineering
  - seo-content-strategy
  - search-experience-optimization
  - content-copywriting
  - natural-content-editing
  assertions:
  - loads relevant specialists during planning before program design
  - asks once for content mode and supports FULL_CONTENT
  - persists design SEO and content planning artifacts when applicable
  - hands execution-relevant selected skills to the coding agent
- id: planning-skill-routing-backend
  class: system_regression
  prompt: Plan a private multi-tenant backend API with no public website or marketing content.
  required:
  - api-contracts
  - auth-architecture
  - database-design
  - security-review
  forbidden:
  - seo-strategy
  - search-experience-optimization
  - natural-content-editing
  assertions:
  - uses backend data auth and security skills during requirements and architecture
  - does not load website SEO/content specialists merely because the system has HTTP endpoints
- id: planning-skill-routing-network
  class: system_regression
  prompt: Plan an automation service that changes firewall and VLAN configuration on managed network controllers.
  required:
  - network-infrastructure-engineering
  - network-automation-engineering
  - security-review
  assertions:
  - network specialists influence discovery blast-radius rollback and verification requirements before implementation
  - project profile does not limit access to vendor specialists discovered later
- id: behavior-authoritative-content
  class: behavior
  prompt: The planner approved homepage copy after research. Implement the page but the coding agent prefers a more
    exciting marketing headline.
  required:
  - content-copywriting
  - natural-content-editing
  assertions:
  - treats approved planning content as authoritative
  - does not rewrite copy for preference alone
  - uses scoped change control if implementation reveals a genuine conflict
- id: behavior-seo-drift
  class: behavior
  prompt: A site redesign is ready to deploy. Prevent accidental noindex canonical schema or heading regressions.
  required:
  - seo-audit-and-drift
  - technical-seo-engineering
  assertions:
  - captures a known-good representative baseline before release
  - compares post-release state without silently changing the baseline
  - routes regressions to owning specialists
- id: behavior-design-dials
  class: behavior
  prompt: Plan a dense B2B operations dashboard before frontend implementation.
  required:
  - ux-product-design
  - ui-design-system
  - data-visualization-design
  assertions:
  - records product-specific density variance and motion direction instead of saying modern UI
  - defines master design language before page/component overrides
  - chooses visualizations from user analytical tasks and data semantics
- id: behavior-natural-content-null-edit
  class: behavior
  prompt: Review already concise factual product documentation for human-sounding prose without changing meaning.
  required:
  - natural-content-editing
  assertions:
  - locks factual and persona anchors
  - edits clustered issues rather than isolated words
  - allows a null edit when the text is already good
  - does not optimize for AI detector evasion
- id: behavior-prompt-refinement
  class: behavior
  prompt: A production classification prompt is inconsistent. Improve it without random wholesale rewriting.
  required:
  - llm-application-engineering
  - ai-evaluation
  assertions:
  - defines a prompt contract and representative eval set
  - classifies the failure before editing
  - changes a targeted variable and checks regressions
  - versions behavior-changing prompt/model/context inputs with evidence
- id: system-debug-behavioral-oracle
  class: system_regression
  prompt: A bug report says concurrent registrations sometimes create duplicate identities. A proposed patch adds
    a retry counter.
  required:
  - implementation-engineering
  assertions:
  - derives the regression oracle from duplicate-identity behavior rather than existence of a retry counter
  - records baseline failure evidence when safe and practical
  - allows a different correct implementation mechanism to satisfy the oracle
- id: system-root-cause-depth-gate
  class: system_regression
  prompt: A UI workaround appears to hide a persistent-state race condition. Repair the defect.
  required:
  - implementation-engineering
  assertions:
  - identifies where the behavior is actually decided before fixing the symptom
  - records deepest responsible cause and proposed fix boundary
  - blocks or re-diagnoses a shallow fix when the boundaries do not reconcile
- id: system-blind-independent-assurance
  class: system_regression
  prompt: A high-assurance authorization change has been implemented and needs acceptance.
  required:
  - adversarial-verification
  - auth-architecture
  assertions:
  - uses an author-independent verifier
  - does not treat implementer success claims as proof
  - keeps parallel sibling assurance verdicts hidden from one another until collection
- id: system-stale-worker-brief
  class: system_regression
  prompt: A worker brief was issued, then the job graph changed before the worker started.
  required:
  - context-efficiency
  assertions:
  - verifies load-bearing authority pointer hashes before work
  - returns STALE_BRIEF on mismatch instead of executing from memory
  - reissues the brief only after orchestrator state reconciliation
- id: system-assurance-profile-independent
  class: system_regression
  prompt: A one-line authorization check has very small implementation scope but high security consequence.
  required:
  - auth-architecture
  - adversarial-verification
  assertions:
  - keeps work size small while raising assurance depth
  - requires stronger independent evidence without inventing unrelated process ceremony
  - does not equate line count with risk
- id: system-capability-attestation-cache
  class: system_regression
  prompt: A repeated run uses the same coding harness, but its permission profile changed since the last capability
    probe.
  required:
  - agent-application-engineering
  assertions:
  - invalidates cached capability attestation when a binding changes
  - treats missing or stale attestation as a cache miss rather than capability proof
  - re-probes only the affected capability surface
- id: system-collect-terminate-worker
  class: system_regression
  prompt: A subagent returned its final report and no concrete follow-up is currently queued.
  required:
  - agent-application-engineering
  assertions:
  - collects and persists the report before worker termination
  - does not keep an idle worker alive merely in case it is needed later
  - allows continuation only when there is a concrete need and trustworthy continuable-session capability
- id: v58-capability-before-framework
  class: system_regression
  prompt: Plan a greenfield SaaS with auth, file uploads, realtime and PostgreSQL. Do not assume a framework yet.
  required:
  - technology-stack-selection
  forbidden: []
  assertions:
  - Derive capability bundle before product names
  - Compare integrated backend platform with component stack
  - Record rejected alternative
- id: v58-self-host-first-not-dogma
  class: system_regression
  prompt: A regulated team prefers self-hosting but a managed provider may materially reduce compliance operations.
    Select architecture.
  required:
  - technology-stack-selection
  forbidden: []
  assertions:
  - Self-hostable preference is weighted
  - Managed option remains eligible with documented material advantage
  - Exit path and lock-in recorded
- id: v58-api-contract-separation
  class: system_regression
  prompt: Design an internal service boundary with synchronous commands and asynchronous domain events.
  required:
  - api-contracts
  - technology-stack-selection
  forbidden: []
  assertions:
  - API contract selected separately from framework
  - Event contract distinguished from HTTP API
  - Gateway is not automatically added
- id: v58-tool-reuse-no-duplicate
  class: system_regression
  prompt: The repo already has verified Playwright and a working web acquisition MCP. Research a site and run browser
    acceptance.
  required:
  - browser-acceptance
  forbidden: []
  assertions:
  - Reuse existing verified providers
  - Do not install CRW/Obscura merely because they are catalog candidates
- id: v58-web-acquisition-gap
  class: system_regression
  prompt: The coding harness has shell and network but no search/scrape/map/crawl capability. Whole-site research
    is required.
  required:
  - technical-research
  forbidden: []
  assertions:
  - Resolve capability gap
  - Prefer CRW candidate after current-source check
  - Project-local safe install without needless user prompt when policy allows
  - Smoke-test and lock resolved tool
- id: v58-browser-oracle
  class: system_regression
  prompt: Obscura is available, but release acceptance claims exact production browser layout and interaction.
  required:
  - browser-acceptance
  forbidden: []
  assertions:
  - Do not use independent renderer as sole production oracle
  - Use real-browser Playwright/project E2E acceptance
- id: v58-command-code-harness
  class: system_regression
  prompt: Execute a CtrlAltDelegate delivery under Command Code with parallel jobs and protected surfaces.
  required:
  - implementation-engineering
  forbidden: []
  assertions:
  - Use canonical AGENTS and .agents/skills
  - Treat native tasks as mirror of JOB-GRAPH
  - Detect/enforce permissions and subagent capabilities
  - Do not add model routing
- id: v58-solution-minimize-platform
  class: system_regression
  prompt: A small self-hosted app needs Postgres, auth, storage, realtime and vector search; no enterprise SSO.
  required:
  - technology-stack-selection
  - postgres-engineering
  forbidden: []
  assertions:
  - Evaluate compact backend platform/pgvector option
  - Do not automatically add Keycloak MinIO Qdrant Redis
  - Justify each additional service from a capability gap
- id: v581-jit-single-skill
  class: system_regression
  prompt: A dispatched worker discovers it must inspect a PostgreSQL transaction edge case. The job objective, requirements,
    acceptance and owned scope do not change.
  required:
  - postgres-engineering
  assertions:
  - Request one canonical skill through L1_JIT_SKILL_INJECT
  - Keep original worker brief immutable
  - Bind grant to brief and skill SHA
  - Do not create project change record
- id: v581-skill-request-rebrief
  class: system_regression
  prompt: A runtime discovery means the same job now needs a browser capability and acceptance step not present
    in its original job contract.
  required:
  - browser-acceptance
  assertions:
  - Escalate to L2_JOB_REBRIEF
  - Invalidate only affected job evidence
  - Do not silently mutate the original brief
- id: v581-skill-request-change
  class: system_regression
  prompt: A worker requests an auth specialist because the discovered dependency requires a new public authentication
    behavior and security boundary.
  required:
  - auth-architecture
  - security-review
  assertions:
  - Escalate to L3_SCOPED_CHANGE
  - Do not use JIT injection to bypass architecture/security change control
- id: v581-release-claim-diff
  class: system_regression
  prompt: A changelog claims three new skills but the release delta shows zero added canonical skill directories.
  required:
  - documentation-engineering
  - verification-gate
  assertions:
  - Release claims validator fails closed
  - Git/release delta outranks prose claim
  - Skill counts and additions are derived from tree evidence
- id: v581-usage-aware-maintenance
  class: system_regression
  prompt: Only a small subset of 154 skills is frequently used across exported projects; a rarely used security-critical
    skill has zero events.
  required:
  - verification-gate
  assertions:
  - Prioritize hot skills for expensive maintenance
  - Keep safety/core skill P0 despite low usage
  - Keep structural QA for all skills
  - Never suppress runtime selection from low usage
- id: v582-verification-blocker-continue
  class: system_regression
  prompt: An Android feature is implemented but final proof requires a physical device the user cannot test until later. Several independent required jobs are ready.
  required:
  - implementation-engineering
  - verification-gate
  assertions:
  - Classify the unavailable device proof as VERIFICATION_BLOCKER when implementation can proceed
  - Record deferred validation and any evidence-backed assumption
  - Continue dependency-ready jobs instead of globally stopping
  - Do not claim the affected feature fully verified
- id: v582-mock-cannot-close-real-journey
  class: system_regression
  prompt: A consumer app renders mock catalog data and a fake player successfully, but the requirement says users must discover and play real provider content.
  required:
  - verification-gate
  - browser-acceptance
  assertions:
  - Treat mock/component success as iteration evidence only
  - Require real provider/runtime and USER_JOURNEY_REAL evidence for completion
  - Keep the requirement unconverged until the real journey passes
- id: v582-provider-consumer-verification
  class: system_regression
  prompt: Provider interfaces and classes exist and unit tests pass, but no live request has been made and the app has not consumed a real response.
  required:
  - integration-engineering
  - verification-gate
  assertions:
  - Do not equate provider implementation with live verification
  - Progress provider state through LIVE_VERIFIED and CONSUMER_VERIFIED
  - Require product-path evidence before closing provider-backed claims
- id: v582-product-drift-consumer-dashboard
  class: system_regression
  prompt: Planning specifies a consumer-first content app, but implementation exposes provider/debug metrics as the primary interface while compilation and tests are green.
  required:
  - ux-product-design
  - verification-gate
  assertions:
  - Compare integrated UX against PRODUCT-CONTRACT primary users and journeys
  - Fail product-drift review despite green structural tests
  - Create targeted repair work before completion
- id: v582-batched-deferred-validation
  class: system_regression
  prompt: Three implemented capabilities each need a later user credential/device action for final validation; unrelated implementation is still available.
  required:
  - implementation-engineering
  - verification-gate
  assertions:
  - Defer the three external checks rather than interrupting after each capability
  - Finish independent implementation and integration first
  - Request the smallest grouped validation set in a deferred-validation wave
  - Failed deferred checks create repair jobs
- id: v582-no-progress-strategy-change
  class: system_regression
  prompt: The same runtime failure signature persists after a patch and the progress signature shows no meaningful change. The worker proposes repeating the same patch strategy.
  required:
  - systematic-debugging
  assertions:
  - Reject the identical no-progress strategy
  - Require new evidence or a changed diagnosis/strategy
  - Escalate through debugger/job resize/capability reroute/architecture review as appropriate
- id: v582-skillopt-offline-gated
  class: system_regression
  prompt: A frequently used skill has repeated execution lapses and routing misses. Improve it with Microsoft SkillOpt without weakening deterministic CtrlAltDelegate governance.
  required:
  - verification-gate
  assertions:
  - Use SkillOpt only as an optional offline maintenance provider
  - Distinguish skill defect from execution/routing/harness causes before editing
  - Stage candidate outside canonical skill root
  - Gate promotion on held-out validation, no-regression, provenance and risk-appropriate cross-harness evidence
  - Never auto-promote or require session harvesting
- id: v582-implemented-unverified-dependency-continuation
  class: system_regression
  prompt: An upstream Android integration is fully implemented but awaits later physical-device verification. A downstream UI/integration job needs the implemented interface but does not require that physical-device proof to continue.
  required:
  - implementation-engineering
  - verification-gate
  assertions:
  - Transition the upstream job to IMPLEMENTED_UNVERIFIED rather than DONE or global BLOCKED
  - Treat a normal IMPLEMENTATION dependency as satisfied by IMPLEMENTED_UNVERIFIED
  - Continue the downstream job while preserving deferred validation
  - Require an explicit VERIFIED dependency gate only when consuming unverified behavior would be unsafe or meaningless
  - Final project completion still waits for real proof and DONE
