version: '5.9'
policy:
  same_behavioral_contract: true
  use_native_capabilities_when_available: true
  unsupported_required_capability: FAIL_LOUD_OR_REROUTE
  model_routing: CAPABILITY_CLASS_ADAPTIVE
  capability_attestation_cache: true
  attestation_cache_miss_is_not_capability_proof: true
  enforcement_truthfulness: declare ENFORCED only after runtime capability attestation;
    otherwise OBSERVED or ADVISORY
  model_routing_policy: config/MODEL-ROUTING-POLICY.yaml
  per_subagent_model_selection: detect
harnesses:
  pi:
    support: REFERENCE
    instructions: native_or_adapter
    canonical_skills: .agents/skills
    blocking_stop_hook: detect
    per_subagent_model_selection: detect
  codex:
    support: FIRST_CLASS
    instructions: AGENTS.md
    canonical_skills: .agents/skills
    sandbox: detect
    approvals: detect
    sessions: detect
    subagents: detect
    hooks: detect
    blocking_stop_hook: false
    per_subagent_model_selection: detect
  deepseek-harness:
    support: FIRST_CLASS_PREVIEW
    upstream_status: developer_preview
    instructions: AGENTS_COMPATIBLE
    canonical_skills: .agents/skills
    duplicate_dsh_skill_copy: false
    imported_control_skills:
      root: ./.ctrlaltdelegate/.agents/skills
      native_strategy: configure_custom_skill_dir_when_available
      fallback: explicit_file_routing
    session_event_log: native
    resume_fork: native
    headless: native
    approval: fail_closed_native
    sandbox:
      modes:
      - read-only
      - workspace-write
      - danger-full-access
      enforcement_quality:
      - full
      - partial
    subagents:
      supported: true
      capabilities_to_detect:
      - outputSchema
      - depthLimit
      - toolFilter
      - persona
      - continuable
    hooks: native_and_bridges
    compaction: optional_native
    blocking_stop_hook: false
    per_subagent_model_selection: detect
  claude-code:
    support: COMPATIBLE
    instructions: CLAUDE.md_and_project_rules
    canonical_skills: .agents/skills_with_adapter
    hooks: detect
    blocking_stop_hook: detect
    per_subagent_model_selection: detect
  opencode:
    support: COMPATIBLE
    instructions: detect
    canonical_skills: .agents/skills_when_supported
    sessions: detect
    plan_build_permissions: detect
    blocking_stop_hook: false
    per_subagent_model_selection: detect
  command-code:
    support: FIRST_CLASS_PREVIEW
    binary: cmd
    instructions: AGENTS.md
    canonical_skills: .agents/skills
    duplicate_skill_copy: false
    capabilities_to_detect:
    - headless_structured_output
    - resume_continue
    - subagents
    - parallel_background
    - persistent_tasks
    - mcp
    - hooks
    - permission_enforcement
    - worktrees
    task_source_of_truth: planning/execution/JOB-GRAPH.json
    model_routing: DETECT_AND_MAP_CLASSES
    promotion: runtime_conformance_required
    blocking_stop_hook: false
    per_subagent_model_selection: detect
attestation:
  template: docs/templates/HARNESS-ATTESTATION.template.json
  bindings:
  - harness_identity
  - harness_version
  - config_hash
  - permission_profile
  - adapter_hash
  reuse_only_when_all_required_bindings_match: true
