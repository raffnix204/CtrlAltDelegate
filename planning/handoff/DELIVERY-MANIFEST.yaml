canonical_skills_root: .agents/skills
skill_export_policy: COPY_PROJECT_SELECTED_DIRECTORIES_ONLY_INCLUDING_REFERENCES
discovery_contract:
  state: planning/discovery/DISCOVERY-STATE.md
  preferences: planning/discovery/TECHNICAL-PREFERENCES.yaml
  authority: REQUIRED_PREFERRED_AUTO
execution_profile_contract:
  state: planning/execution/EXECUTION-PROFILE.yaml
  profiles:
  - MICRO
  - SMALL
  - STANDARD
  - HIGH_RISK
  quality_floor: REQUIREMENT_AND_RISK_DRIVEN
  worker_liveness: PROGRESS_AWARE_NO_UNIVERSAL_STATIC_TIMEOUT
language_contract:
  conversation: FOLLOW_USER_LANGUAGE_UNLESS_EXPLICITLY_OVERRIDDEN
  ctrlaltdelegate_artifacts: ENGLISH
  localized_product_content: ALLOWED_WHEN_PROJECT_REQUIRES
version: 5.9
assurance_contract:
  work_and_assurance_axes: INDEPENDENT
  profiles:
  - NORMAL
  - ELEVATED
  - HIGH
  - CRITICAL
  behavioral_oracle: AUTHORITY_DERIVED
  root_cause_depth_gate: RISK_TRIGGERED
completion_contract:
  job_transition: scripts/transition_job.py
  project_gate: scripts/validate_product_completion.py
  verification_blocker_does_not_stop_dependency_ready_execution: true
  implementation_dependency_accepts_implemented_unverified: true
control_plane_contract:
  state_authority: REVISIONED_SEALED_CONTROLLER_MUTATIONS
  ownership: JOB_CLAIM_LEASE_ATTEMPT
  pre_dispatch_reconciliation: true
  worker_result_schema: docs/schemas/WORKER-RESULT.schema.json
  objective_progress: true
  review_verdicts:
  - PASS
  - FAIL
  - UNVERIFIABLE
  stop_gate: CAPABILITY_NEGOTIATED
model_routing_contract:
  policy: config/MODEL-ROUTING-POLICY.yaml
  state: planning/execution/MODEL-ROUTING-STATE.yaml
  classes:
  - FRONTIER
  - BALANCED
  - EFFICIENT
  main_orchestrator: FRONTIER_SPAWN_ONLY
  default_implementation: EFFICIENT
  sol_effort_ceiling: high
  independent_review: FRESH_AGENT_REQUIRED
