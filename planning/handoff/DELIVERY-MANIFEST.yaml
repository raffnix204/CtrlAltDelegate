delivery_version: 5.8.1
layout: GITHUB_NATIVE_ROOT
persistent_planning_root: planning
handoff_root: planning/handoff
root_policy:
  greenfield: CONTENTS_MAY_BECOME_INITIAL_REPOSITORY_BASELINE
  brownfield: SAFE_MERGE_NEVER_BLIND_OVERWRITE
planning_git_policy:
  version_planning: true
  ignore_whole_planning_tree: false
  transient_only:
  - planning/private/
  - planning/**/raw/
  - planning/**/tmp/
  - planning/**/logs/
  - planning/**/cache/
  - planning/import-conflicts/
required_files:
- AGENTS.md
- planning/discovery/DISCOVERY-STATE.md
- planning/discovery/TECHNICAL-PREFERENCES.yaml
- planning/handoff/START-HERE.md
- planning/handoff/CODING-AGENT-HANDOFF.md
- planning/handoff/FINAL-START-PROMPT.md
- planning/execution/STATE.md
- planning/execution/EXECUTION-PROFILE.yaml
- planning/execution/AUTOPILOT-GOAL.md
- planning/architecture/STACK-MANIFEST.yaml
- planning/architecture/PROGRAM-DESIGN.md
- planning/execution/SKILLS-MANIFEST.yaml
- planning/execution/CONVERGENCE-MATRIX.json
- planning/execution/EVIDENCE-INDEX.json
- planning/research/RESEARCH-POLICY.yaml
- docs/system/FULL-LIFECYCLE-ENTRY-AND-MODE-DETECTION.md
- docs/system/LANGUAGE-AND-INTERACTION.md
- planning/context/PLANNING-SKILL-STATE.yaml
- config/PLANNING-SKILL-ROUTING.yaml
- docs/system/SKILL-DRIVEN-PLANNING.md
- config/ASSURANCE-PROFILES.yaml
- docs/system/ASSURANCE-BEHAVIORAL-ORACLES-AND-ROOT-CAUSE-DEPTH.md
- docs/system/WORKER-BRIEF-INTEGRITY-AND-CAPABILITY-ATTESTATION.md
- planning/execution/ASSURANCE-STATE.yaml
- planning/execution/ROOT-CAUSE-DEPTH.json
- config/SKILL-ESCALATION-POLICY.yaml
- planning/execution/SKILL-REQUESTS.jsonl
- planning/execution/SKILL-USAGE-EVENTS.jsonl
- docs/system/RUNTIME-SKILL-ESCALATION.md
- config/SKILL-MAINTENANCE-POLICY.yaml
canonical_skills_root: .agents/skills
skill_export_policy: COPY_PROJECT_SELECTED_DIRECTORIES_ONLY_INCLUDING_REFERENCES
discovery_contract:
  state: planning/discovery/DISCOVERY-STATE.md
  preferences: planning/discovery/TECHNICAL-PREFERENCES.yaml
  authority: REQUIRED_PREFERRED_AUTO
execution_profile_contract:
  state: planning/execution/EXECUTION-PROFILE.yaml
  profiles:
  - MICRO
  - SMALL
  - STANDARD
  - HIGH_RISK
  quality_floor: REQUIREMENT_AND_RISK_DRIVEN
  worker_liveness: PROGRESS_AWARE_NO_UNIVERSAL_STATIC_TIMEOUT
language_contract:
  conversation: FOLLOW_USER_LANGUAGE_UNLESS_EXPLICITLY_OVERRIDDEN
  ctrlaltdelegate_artifacts: ENGLISH
  localized_product_content: ALLOWED_WHEN_PROJECT_REQUIRES
version: 5.8.1
assurance_contract:
  work_and_assurance_axes: INDEPENDENT
  profiles:
  - NORMAL
  - ELEVATED
  - HIGH
  - CRITICAL
  behavioral_oracle: AUTHORITY_DERIVED
  root_cause_depth_gate: RISK_TRIGGERED
