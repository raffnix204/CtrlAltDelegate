version: '5.8.1'
principle: Planning research is the baseline; execution performs only the additional research needed to safely make
  current technical decisions.
modes:
  NONE: Current planning/repository/runtime evidence already closes the decision.
  VERIFY_DRIFT: Re-check one or more unstable facts such as versions, API support, pricing/licensing, platform limits
    or current docs.
  TARGETED: Research a small candidate set for one concrete implementation/architecture decision.
  SPIKE: Run a minimal code/config/profiling/contract experiment because documentation alone cannot establish fit.
source_priority:
- repository/runtime evidence
- official specification/documentation
- official repository/releases
- vendor support/compatibility docs
- strong independent technical evidence
- community as lead only
autonomy:
  routine_technical_decisions: AUTO
  update_stack_manifest_after_material_decision: true
  update_adr_after_hard_to_reverse_decision: true
  reroute_skills_jobs_after_material_decision: true
  ask_user_only_for:
  - product/scope behavior change
  - possible data loss
  - weaker security/privacy
  - material recurring cost/vendor business impact
  - compliance exception
  - required external credential/approval unavailable
efficiency:
  do_not_repeat_planner_research: true
  stop_when_decision_gap_closed: true
  prefer_targeted_source_reads: true
  prefer_executable_spike_when_faster_than_more_research: true
  persist_raw_large_evidence_to_disk: true
web_acquisition:
  provider_neutral: true
  existing_capability_first: true
  verbs:
  - search
  - scrape
  - map
  - crawl
  - extract
  browser_separate_for:
  - interaction
  - authentication
  - javascript state
  - screenshots
  - visual acceptance
