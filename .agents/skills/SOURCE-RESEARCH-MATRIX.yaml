primary_authority_families:
- React and framework official documentation for current APIs/version behavior
- PostgreSQL/MongoDB/database official documentation for engine semantics
- W3C/WCAG and platform accessibility documentation
- OAuth/OIDC specifications and selected identity-provider official documentation
- Cloud/IaC/network vendor documentation for current resource/provider/runtime behavior
- OWASP and applicable standards for security baselines
