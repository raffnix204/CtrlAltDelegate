    used_for:
    - progressive disclosure and bundled references/scripts
    - React Native and Flutter failure-mode inventory
    - skill creator baseline/eval loop ideas
    adaptation: prescriptive library/tool choices are treated as hypotheses, not defaults
  officialskills:
    url: https://officialskills.sh/
    class: discovery_index
    used_for:
    - locating current vendor/project-maintained skill repositories
    - identifying high-value domain gaps and version-sensitive specialist topics
    caution: verify the underlying repository and first-party documentation; index
      labels are not authority
  gstack:
    repository: https://github.com/garrytan/gstack
    reviewed_snapshot: 1.67.0.0 (user-supplied archive)
    class: community_agent_workflow_reference
    used_for:
    - deterministic artifact-path thinking
    - plan/review completion gates
    - persistent decision/review state on disk
    - handoff/transition closure checks
    adaptation: concepts independently rewritten; Claude-specific slash commands,
      browser stack, telemetry, gbrain, Bun tooling and opinionated role pipeline
      are not inherited
  autoprompt_skill:
    repository: https://github.com/Spielewoy/autoprompt-skill
    class: community_agent_orchestration_reference
    reviewed_for: V5.7.2
    used_for:
    - behavior-derived regression oracle
    - root-cause depth gate
    - blind independent assurance
    - hash-bound compact worker briefs
    - capability attestation fast path
    - collect-then-stop worker lifecycle
    not_adopted:
    - universal strict TDD
    - universal 95 percent coverage mandate
    - fixed multi-level persona hierarchy
    - model routing
