domain_skill_research_v5_7_1:
  policy: External skill repositories are coverage and mechanism research. CtrlAltDelegate
    independently rewrites concepts, keeps current first-party evidence authoritative
    for drift-sensitive facts, and does not inherit provider-specific runtime assumptions.
  repositories:
  - name: claude-seo
    url: https://github.com/AgriciDaniel/claude-seo
    ideas:
    - specialized SEO planning/audit coverage
    - SEO drift baselines
    - SXO page-type and user-task alignment
    - conditional specialists and progressive references
  - name: ui-ux-pro-max-skill
    url: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
    ideas:
    - design-direction reasoning before implementation
    - visual variance/motion/density planning dials
    - master design system with scoped page overrides
    - data-visualization and stack-aware UX guidance
  - name: humanizer-de
    url: https://github.com/marmbiz/humanizer-de
    ideas:
    - claim/persona locks
    - cluster-based naturalness review
    - minimal revision and null-edit behavior
    - evidence-safe editing rather than detector evasion
    license_note: Concepts only. Do not import language-specific Wikipedia-derived
      pattern catalogs; upstream contains mixed MIT and CC BY-SA material.
  - name: prompts.chat
    url: https://github.com/f/prompts.chat
    ideas:
    - prompt contract structure
    - targeted iterative refinement
    - structured outputs/examples as discriminating tools
    - record and evaluate prompt changes rather than random rewrites
