sources:
  ecc:
    repository: https://github.com/affaan-m/ECC
    reviewed_commit: c9de8f5b2b3a225bca9befa2b7700aa5e3a4d1b8
    class: community_engineering_reference
    used_for:
    - react component/state/effect and server-client pattern depth
    - security review/checklist and framework-rule organization ideas
    - skill/rule separation and current agent-skill ergonomics
    adaptation: concepts independently rewritten; ECC harness/model assumptions are
      not inherited
  shokunin:
