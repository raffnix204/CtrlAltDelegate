library: software-planning-lead-v5.8
version: '5.8'
library_count: 154
policy:
  project_export: copy_selected_skill_directories_only
  runtime_download_required: false
  project_local_skills_are_canonical: true
  load_per_job: true
  no_fixed_skill_count_limit: true
  selection_rule: select the smallest complete set justified by project/stack/capability/risk;
    never add unrelated specialists
  progressive_loading:
    entrypoint: SKILL.md
    references: load only job-relevant files under references/
    full_library_preload: false
    planning_view: SKILL.md decision surface only; implementation references stay
      progressive
  autonomous_research:
    modes:
    - NONE
    - VERIFY_DRIFT
    - TARGETED
    - SPIKE
    reuse_exported_planning_research_first: true
    current_authoritative_sources_for_drift: true
    routine_technical_decisions_autonomous: true
    reroute_after_material_research_decision: true
  job_contract:
    required_fields:
    - required_skill_ids
    - canonical_skill_paths
    - why_each_skill_is_needed
    - research_need
    delegation: worker reads exact required SKILL.md paths before work; reads only
      relevant reference files
    worker_return:
    - STATUS
    - SKILLS_APPLIED
    - RESEARCH_PERFORMED
    - critical_findings
    - evidence
    - report_path
  documentation_lifecycle:
    every_commit_consistent: true
    every_push_consistent: true
    beginner_readme: true
    final_fresh_user_review: true
  context_freshness:
    fresh_workers_default: true
    fresh_reviewers: true
    context_epochs: true
  parallelism:
    maximize_safe: true
    fixed_agent_count: false
    serial_independent_requires_reason: true
  solution_minimization:
    substantive_implementation: true
    smallest_complete_solution: true
    protected_floors:
    - correctness
    - security
    - reliability
    - accessibility
    - operability
    - tests
    - documentation
  convergence:
    required_for_completion: true
    sha_bound_evidence: true
    iterative_plan_correction: true
  skill_evaluation:
    routing_evals: true
    behavior_evals: true
    system_evolution_evals: true
    model_hardcoding: false
  harness_support:
    pi: reference
    codex: first_class_equal_behavioral_contract
    deepseek_harness: first_class_preview
    claude_code: compatible_same_contract
    opencode: compatible_same_contract
  skill_schema: 5.7.1-domain-expertise+planning-registry
  global_execution_contract: docs/system/SKILL-EXECUTION-CONTRACT.md
  source_research_matrix: .agents/skills/SOURCE-RESEARCH-MATRIX.yaml
  planning_skill_orchestration:
    contract: docs/system/SKILL-DRIVEN-PLANNING.md
    registry: config/PLANNING-SKILL-ROUTING.yaml
    state: planning/context/PLANNING-SKILL-STATE.yaml
    early_capability_scan: true
    refresh_each_phase: true
    consult_relevant_skill_before_owned_planning_decision: true
    full_library_preload: false
    same_selected_skills_available_to_execution: true
core_routing:
  substantive_implementation:
  - solution-minimization-engineering
  - implementation-engineering
  - matching language/runtime specialist(s)
  - matching framework/datastore/capability specialists
  bugfix:
  - systematic-debugging
  - matching stack/domain specialists
  - tdd-workflow when practical
  - code-review
  - verification-gate
  brownfield:
  - repository-onboarding
  - matching existing stack specialists
  research_gap:
  - technical-research
  - affected decision specialist
  substantive_review:
  - code-review
  - verification-gate
  - triggered security/domain/stack specialists
  high_risk:
